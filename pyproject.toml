[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "locallab"
version = "0.2.0"
description = "Umbrella CLI for the LocalLab family of local-first agent tools."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Victor"}]
requires-python = ">=3.10"
keywords = ["agent", "local-first", "cli", "pipeline", "locallab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
locallab = "locallab.cli:main"

[project.urls]
Homepage = "https://github.com/Victorchatter/LocalLab"
Repository = "https://github.com/Victorchatter/LocalLab"

[tool.setuptools.packages.find]
include = ["locallab*"]

[tool.setuptools.package-data]
locallab = ["data/*.json", "recipes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
